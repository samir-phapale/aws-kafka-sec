name: Terraform Apply + Phase 3 Validation

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: kafka-terraform-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  apply:
    name: apply + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=aws-kafka-sec/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color

      - name: Read Terraform outputs
        id: tf_outputs
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "topic_name=$(terraform output -raw kafka_topic_name)" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$(terraform output -raw phase3_secret_arn)" >> "$GITHUB_OUTPUT"

      - name: Start broker if stopped (Cloud Custodian stops instances nightly)
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ steps.tf_outputs.outputs.instance_id }}"             --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Broker state: $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "${{ steps.tf_outputs.outputs.instance_id }}"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "${{ steps.tf_outputs.outputs.instance_id }}"
          fi

      - name: Wait for instance to reach Running + SSM online
        run: |
          aws ec2 wait instance-running --instance-ids "${{ steps.tf_outputs.outputs.instance_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.tf_outputs.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text)
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online"
              break
            fi
            echo "Waiting for SSM agent (attempt $i)..."
            sleep 10
          done
          if [ "$STATUS" != "Online" ]; then
            echo "SSM agent never came online"
            exit 1
          fi

      - name: Wait for Kafka provisioning to finish
        run: |
          for i in $(seq 1 30); do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "${{ steps.tf_outputs.outputs.instance_id }}" \
              --document-name "AWS-RunShellScript" \
              --parameters '{"commands":["test -f /opt/kafka-ready"]}' \
              --query "Command.CommandId" --output text)
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.tf_outputs.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              echo "Kafka provisioning complete (/opt/kafka-ready found)"
              break
            fi
            echo "Waiting for Kafka provisioning to finish (attempt $i, status=$STATUS)..."
            sleep 15
          done
          if [ "$STATUS" != "Success" ]; then
            echo "Kafka provisioning did not finish (/opt/kafka-ready not found)"
            exit 1
          fi

      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run Kafka end-to-end integration tests
        env:
          KAFKA_INSTANCE_ID: ${{ steps.tf_outputs.outputs.instance_id }}
          KAFKA_TOPIC_NAME: ${{ steps.tf_outputs.outputs.topic_name }}
          KAFKA_SECRET_ARN: ${{ steps.tf_outputs.outputs.secret_arn }}
        run: pytest tests/test_kafka_e2e.py -v -s

